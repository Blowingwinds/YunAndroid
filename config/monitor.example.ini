[monitor]
poll_interval_minutes = 60
stale_threshold_minutes = 60
missing_grace_minutes = 30
max_workers = 8
control_host = 127.0.0.1
control_port = 18765
control_token = replace-with-a-random-local-token

[paths]
queue_file = cloud_phone_queue.xlsx
state_db = ../data/monitor/monitor.sqlite3

[feishu]
alert_webhook_url = https://open.feishu.cn/open-apis/bot/v2/hook/REPLACE_ME
security_keyword = REPLACE_ME
secret =

[excel_summary]
run_time = 09:40
source_date = yesterday
tag = daily
max_workers = 8
catchup_minutes = 120
device_lock_timeout_minutes = 30

[excel_summary_paths]
queue_file = cloud_phone_queue.xlsx
json_root = ../SF_json
output_dir = ../data/excel/Bydate
state_file = ../data/monitor/excel_summary_state.json

[excel_summary_control]
control_host = 127.0.0.1
control_port = 18766
control_token = replace-with-another-random-local-token
